# =============================================================================
# Synthetic-ERP-Data-Generation-Platform — Sealed Secrets Template
# =============================================================================
#
# This manifest defines SealedSecret resources (Bitnami SealedSecrets) and a
# standard Kubernetes TLS Secret for the platform.  SealedSecrets are safe to
# store in version control because they can only be decrypted by the controller
# running inside the target cluster.
#
# PREREQUISITES:
#   1. Install the Bitnami SealedSecrets controller in the cluster:
#        helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#        helm install sealed-secrets sealed-secrets/sealed-secrets \
#          --namespace kube-system \
#          --set fullnameOverride=sealed-secrets-controller
#
#   2. Install the kubeseal CLI:
#        brew install kubeseal   # macOS
#        # or download from https://github.com/bitnami-labs/sealed-secrets/releases
#
# WORKFLOW — Encrypting a new secret value:
#   a) Create a plain Kubernetes Secret manifest (DO NOT commit this file):
#        kubectl create secret generic mongodb-credentials \
#          --namespace synthetic-erp-platform \
#          --from-literal=MONGODB_URI='mongodb://user:pass@host:27017/db' \
#          --dry-run=client -o yaml > /tmp/plain-secret.yaml
#
#   b) Encrypt with kubeseal:
#        kubeseal --format yaml \
#          --controller-name sealed-secrets-controller \
#          --controller-namespace kube-system \
#          < /tmp/plain-secret.yaml \
#          > sealed-secret.yaml
#
#   c) Copy the encrypted values from sealed-secret.yaml into the appropriate
#      spec.encryptedData fields below, then commit this file.
#
#   d) Securely delete the plain-text file:
#        shred -u /tmp/plain-secret.yaml
#
# ROTATION POLICY:
#   - Database credentials: Rotate every 90 days
#   - Auth0 client secrets: Rotate every 180 days
#   - JWT signing keys: Rotate every 365 days (with overlap period)
#   - Cloud provider credentials: Rotate every 90 days
#   - AES-256 encryption keys: Rotate every 365 days (re-encrypt data)
#   - TLS certificates: Rotate before expiry (use cert-manager for automation)
#
# SOC 2 TYPE II COMPLIANCE NOTES:
#   - All secret access is logged via Kubernetes audit policy
#   - SealedSecrets provide encryption at rest for version-controlled secrets
#   - Rotation annotations enable automated compliance reporting
#   - Tamper-evident: changing encryptedData without re-sealing causes
#     decryption failure, providing integrity verification
#
# =============================================================================

# -----------------------------------------------------------------------------
# 1. MongoDB Credentials
# -----------------------------------------------------------------------------
# Used by: API Gateway, Generation Engine, Profiling Service, Quality Service,
#          Compliance Service, Provisioning Service
# Rotation: Every 90 days
# -----------------------------------------------------------------------------
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mongodb-credentials
  namespace: synthetic-erp-platform
  labels:
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kubeseal
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
    synthetic-erp.io/rotation-policy: "90d"
    synthetic-erp.io/rotation-last: "1970-01-01T00:00:00Z"
    synthetic-erp.io/rotation-next: "PENDING_INITIAL_SETUP"
    synthetic-erp.io/secret-owner: "platform-admin"
    synthetic-erp.io/audit-classification: "critical"
    synthetic-erp.io/compliance-frameworks: "soc2-typeii,gdpr,hipaa"
    description: "MongoDB 7.0 connection credentials for the metadata repository"
spec:
  encryptedData:
    # Replace each value below with the kubeseal-encrypted ciphertext.
    # Run: kubeseal --raw --namespace synthetic-erp-platform --name mongodb-credentials \
    #        --from-file=/dev/stdin <<< 'mongodb://syntheticerp:password@mongodb-0.mongodb-headless:27017,mongodb-1.mongodb-headless:27017,mongodb-2.mongodb-headless:27017/synthetic_erp?replicaSet=rs0&authSource=admin'
    MONGODB_URI: AgBY3i4OJSWK+PiTySYZZA9rO43cGDEq+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # Run: kubeseal --raw ... <<< 'syntheticerp'
    MONGODB_USERNAME: AgCJ7qH+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # Run: kubeseal --raw ... <<< '<secure-random-password>'
    MONGODB_PASSWORD: AgDK8rI+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # Run: kubeseal --raw ... <<< 'synthetic_erp'
    MONGODB_DATABASE: AgEL9sJ+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
  template:
    metadata:
      name: mongodb-credentials
      namespace: synthetic-erp-platform
      labels:
        app.kubernetes.io/part-of: synthetic-erp-platform
        app.kubernetes.io/component: database
        app.kubernetes.io/managed-by: kubeseal
      annotations:
        synthetic-erp.io/rotation-policy: "90d"
        synthetic-erp.io/audit-classification: "critical"
    type: Opaque
---
# -----------------------------------------------------------------------------
# 2. Redis Credentials
# -----------------------------------------------------------------------------
# Used by: API Gateway (rate limiting, sessions), Generation Engine (progress)
# Rotation: Every 90 days
# -----------------------------------------------------------------------------
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: redis-credentials
  namespace: synthetic-erp-platform
  labels:
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kubeseal
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
    synthetic-erp.io/rotation-policy: "90d"
    synthetic-erp.io/rotation-last: "1970-01-01T00:00:00Z"
    synthetic-erp.io/rotation-next: "PENDING_INITIAL_SETUP"
    synthetic-erp.io/secret-owner: "platform-admin"
    synthetic-erp.io/audit-classification: "critical"
    synthetic-erp.io/compliance-frameworks: "soc2-typeii"
    description: "Redis 7.x connection credentials for caching and session management"
spec:
  encryptedData:
    # Run: kubeseal --raw --namespace synthetic-erp-platform --name redis-credentials \
    #        --from-file=/dev/stdin <<< 'redis://:password@redis-master.synthetic-erp-platform.svc.cluster.local:6379/0'
    REDIS_URL: AgFM0tK+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # Run: kubeseal --raw ... <<< '<secure-random-password>'
    REDIS_PASSWORD: AgGN1uL+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
  template:
    metadata:
      name: redis-credentials
      namespace: synthetic-erp-platform
      labels:
        app.kubernetes.io/part-of: synthetic-erp-platform
        app.kubernetes.io/component: cache
        app.kubernetes.io/managed-by: kubeseal
      annotations:
        synthetic-erp.io/rotation-policy: "90d"
        synthetic-erp.io/audit-classification: "critical"
    type: Opaque
---
# -----------------------------------------------------------------------------
# 3. Auth0 Credentials
# -----------------------------------------------------------------------------
# Used by: API Gateway (JWT validation, OAuth2 callbacks)
# Rotation: Every 180 days
# -----------------------------------------------------------------------------
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: auth0-credentials
  namespace: synthetic-erp-platform
  labels:
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kubeseal
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
    synthetic-erp.io/rotation-policy: "180d"
    synthetic-erp.io/rotation-last: "1970-01-01T00:00:00Z"
    synthetic-erp.io/rotation-next: "PENDING_INITIAL_SETUP"
    synthetic-erp.io/secret-owner: "platform-admin"
    synthetic-erp.io/audit-classification: "critical"
    synthetic-erp.io/compliance-frameworks: "soc2-typeii,gdpr,hipaa,ccpa"
    description: "Auth0 OAuth2/OIDC credentials for identity and access management"
spec:
  encryptedData:
    # Run: kubeseal --raw --namespace synthetic-erp-platform --name auth0-credentials \
    #        --from-file=/dev/stdin <<< 'your-tenant.auth0.com'
    AUTH0_DOMAIN: AgHO2vM+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # Run: kubeseal --raw ... <<< '<auth0-client-id>'
    AUTH0_CLIENT_ID: AgIP3wN+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # Run: kubeseal --raw ... <<< '<auth0-client-secret>'
    AUTH0_CLIENT_SECRET: AgJQ4xO+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # Run: kubeseal --raw ... <<< 'https://api.synthetic-erp.example.com'
    AUTH0_AUDIENCE: AgKR5yP+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
  template:
    metadata:
      name: auth0-credentials
      namespace: synthetic-erp-platform
      labels:
        app.kubernetes.io/part-of: synthetic-erp-platform
        app.kubernetes.io/component: authentication
        app.kubernetes.io/managed-by: kubeseal
      annotations:
        synthetic-erp.io/rotation-policy: "180d"
        synthetic-erp.io/audit-classification: "critical"
    type: Opaque
---
# -----------------------------------------------------------------------------
# 4. JWT Signing Keys
# -----------------------------------------------------------------------------
# Used by: API Gateway (token signing/verification), all services (token
#          verification via shared public key)
# Rotation: Every 365 days with 30-day overlap for key rollover
# Algorithm: RS256 (RSA 2048-bit minimum)
# -----------------------------------------------------------------------------
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jwt-keys
  namespace: synthetic-erp-platform
  labels:
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kubeseal
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
    synthetic-erp.io/rotation-policy: "365d"
    synthetic-erp.io/rotation-overlap: "30d"
    synthetic-erp.io/rotation-last: "1970-01-01T00:00:00Z"
    synthetic-erp.io/rotation-next: "PENDING_INITIAL_SETUP"
    synthetic-erp.io/secret-owner: "platform-admin"
    synthetic-erp.io/audit-classification: "critical"
    synthetic-erp.io/compliance-frameworks: "soc2-typeii"
    description: "JWT RS256 signing keys for API token management"
spec:
  encryptedData:
    # HMAC symmetric key for Flask-JWT-Extended internal operations
    # Run: kubeseal --raw --namespace synthetic-erp-platform --name jwt-keys \
    #        --from-file=/dev/stdin <<< "$(openssl rand -hex 64)"
    JWT_SECRET_KEY: AgLS6zQ+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # RSA private key in PEM format for signing JWTs (RS256)
    # Generate: openssl genrsa -out /tmp/jwt-private.pem 2048
    # Run: kubeseal --raw --namespace synthetic-erp-platform --name jwt-keys \
    #        --from-file=/dev/stdin < /tmp/jwt-private.pem
    JWT_PRIVATE_KEY: AgMT70R+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # RSA public key in PEM format for verifying JWTs
    # Generate: openssl rsa -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
    # Run: kubeseal --raw --namespace synthetic-erp-platform --name jwt-keys \
    #        --from-file=/dev/stdin < /tmp/jwt-public.pem
    JWT_PUBLIC_KEY: AgNU81S+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
  template:
    metadata:
      name: jwt-keys
      namespace: synthetic-erp-platform
      labels:
        app.kubernetes.io/part-of: synthetic-erp-platform
        app.kubernetes.io/component: authentication
        app.kubernetes.io/managed-by: kubeseal
      annotations:
        synthetic-erp.io/rotation-policy: "365d"
        synthetic-erp.io/rotation-overlap: "30d"
        synthetic-erp.io/audit-classification: "critical"
    type: Opaque
---
# -----------------------------------------------------------------------------
# 5. Cloud Provider Credentials
# -----------------------------------------------------------------------------
# Used by: Provisioning Service (S3, Azure Blob, GCS exports)
# Rotation: Every 90 days
# Principle of least privilege: each credential should have only the
# permissions required for uploading/downloading synthetic data files.
# -----------------------------------------------------------------------------
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloud-credentials
  namespace: synthetic-erp-platform
  labels:
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kubeseal
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
    synthetic-erp.io/rotation-policy: "90d"
    synthetic-erp.io/rotation-last: "1970-01-01T00:00:00Z"
    synthetic-erp.io/rotation-next: "PENDING_INITIAL_SETUP"
    synthetic-erp.io/secret-owner: "platform-admin"
    synthetic-erp.io/audit-classification: "critical"
    synthetic-erp.io/compliance-frameworks: "soc2-typeii"
    description: "Cloud provider credentials for multi-cloud storage export (AWS S3, Azure Blob, GCP Cloud Storage)"
spec:
  encryptedData:
    # ---- AWS credentials (for S3 multi-part upload with AES-256 encryption) ----
    # IAM user/role with s3:PutObject, s3:GetObject, s3:ListBucket permissions only
    # Run: kubeseal --raw --namespace synthetic-erp-platform --name cloud-credentials \
    #        --from-file=/dev/stdin <<< '<aws-access-key-id>'
    AWS_ACCESS_KEY_ID: AgOV92T+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # Run: kubeseal --raw ... <<< '<aws-secret-access-key>'
    AWS_SECRET_ACCESS_KEY: AgPW03U+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # ---- Azure credentials (for Azure Blob Storage with managed identity) ----
    # Connection string with SAS token or Shared Key for the storage account
    # Run: kubeseal --raw ... <<< 'DefaultEndpointsProtocol=https;AccountName=...;AccountKey=...;EndpointSuffix=core.windows.net'
    AZURE_STORAGE_CONNECTION_STRING: AgQX14V+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # ---- GCP credentials (for Cloud Storage with service account auth) ----
    # Service account JSON key with roles/storage.objectAdmin on target bucket
    # Run: kubeseal --raw ... --from-file=/dev/stdin < /path/to/service-account.json
    GCP_SERVICE_ACCOUNT_KEY: AgRY25W+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
  template:
    metadata:
      name: cloud-credentials
      namespace: synthetic-erp-platform
      labels:
        app.kubernetes.io/part-of: synthetic-erp-platform
        app.kubernetes.io/component: cloud-storage
        app.kubernetes.io/managed-by: kubeseal
      annotations:
        synthetic-erp.io/rotation-policy: "90d"
        synthetic-erp.io/audit-classification: "critical"
    type: Opaque
---
# -----------------------------------------------------------------------------
# 6. TLS Certificate
# -----------------------------------------------------------------------------
# Used by: NGINX Ingress Controller for TLS 1.3 termination
# Referenced by: infrastructure/kubernetes/ingress.yaml (secretName)
# Rotation: Before certificate expiry (recommended: use cert-manager for
#           automatic renewal with Let's Encrypt or internal CA)
#
# NOTE: This is a standard Kubernetes Secret (type: kubernetes.io/tls),
#       NOT a SealedSecret.  In production, use cert-manager with a
#       ClusterIssuer for automated certificate lifecycle management:
#
#   apiVersion: cert-manager.io/v1
#   kind: Certificate
#   metadata:
#     name: synthetic-erp-tls-cert
#     namespace: synthetic-erp-platform
#   spec:
#     secretName: synthetic-erp-tls-secret
#     issuerRef:
#       name: letsencrypt-prod
#       kind: ClusterIssuer
#     dnsNames:
#       - synthetic-erp.example.com
#       - "*.synthetic-erp.example.com"
#
# For initial setup or air-gapped environments, populate manually:
#   kubectl create secret tls synthetic-erp-tls-secret \
#     --namespace synthetic-erp-platform \
#     --cert=/path/to/tls.crt \
#     --key=/path/to/tls.key
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: synthetic-erp-tls-secret
  namespace: synthetic-erp-platform
  labels:
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: tls
    app.kubernetes.io/managed-by: kubectl
  annotations:
    synthetic-erp.io/rotation-policy: "before-expiry"
    synthetic-erp.io/rotation-last: "1970-01-01T00:00:00Z"
    synthetic-erp.io/rotation-next: "PENDING_INITIAL_SETUP"
    synthetic-erp.io/secret-owner: "platform-admin"
    synthetic-erp.io/audit-classification: "critical"
    synthetic-erp.io/compliance-frameworks: "soc2-typeii"
    synthetic-erp.io/tls-min-version: "1.3"
    description: "TLS certificate and private key for HTTPS ingress (TLS 1.3 minimum)"
type: kubernetes.io/tls
data:
  # Base64-encoded TLS certificate (PEM format)
  # Generate self-signed for development:
  #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
  #     -keyout /tmp/tls.key -out /tmp/tls.crt \
  #     -subj "/CN=synthetic-erp.example.com/O=SyntheticERP"
  # Encode: base64 -w0 /tmp/tls.crt
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tClBMQUNFSE9MREVSX1JFUExBQ0VfV0lUSF9SRUFMX0NFUlRJRklDQVRFCi0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0K
  # Base64-encoded TLS private key (PEM format)
  # Encode: base64 -w0 /tmp/tls.key
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tClBMQUNFSE9MREVSX1JFUExBQ0VfV0lUSF9SRUFMX1BSSVZBVEVfS0VZCi0tLS0tRU5EIFBSSVZBVEUgS0VZLS0tLS0K
---
# -----------------------------------------------------------------------------
# 7. Encryption Keys
# -----------------------------------------------------------------------------
# Used by: All backend services (AES-256-GCM data-at-rest encryption),
#          API Gateway (Flask session encryption)
# Rotation: Every 365 days — requires re-encryption of stored data
#
# IMPORTANT: When rotating AES_256_KEY, implement a key versioning strategy:
#   1. Add the new key alongside the old key (AES_256_KEY_V2)
#   2. Update services to encrypt with new key, decrypt with both
#   3. Run a background job to re-encrypt all data with the new key
#   4. Remove the old key after re-encryption is complete
# -----------------------------------------------------------------------------
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: encryption-keys
  namespace: synthetic-erp-platform
  labels:
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: secrets
    app.kubernetes.io/managed-by: kubeseal
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
    synthetic-erp.io/rotation-policy: "365d"
    synthetic-erp.io/rotation-last: "1970-01-01T00:00:00Z"
    synthetic-erp.io/rotation-next: "PENDING_INITIAL_SETUP"
    synthetic-erp.io/secret-owner: "platform-admin"
    synthetic-erp.io/audit-classification: "critical"
    synthetic-erp.io/compliance-frameworks: "soc2-typeii,gdpr,hipaa,ccpa"
    synthetic-erp.io/encryption-algorithm: "AES-256-GCM"
    description: "AES-256 encryption key for data at rest and Flask session secret key"
spec:
  encryptedData:
    # AES-256 key for data-at-rest encryption (32 bytes / 256 bits)
    # Generate: openssl rand -hex 32
    # Run: kubeseal --raw --namespace synthetic-erp-platform --name encryption-keys \
    #        --from-file=/dev/stdin <<< "$(openssl rand -hex 32)"
    AES_256_KEY: AgSZ36X+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
    # Flask secret key for session cookie signing and CSRF protection
    # Generate: python3 -c "import secrets; print(secrets.token_hex(64))"
    # Run: kubeseal --raw --namespace synthetic-erp-platform --name encryption-keys \
    #        --from-file=/dev/stdin <<< "$(python3 -c 'import secrets; print(secrets.token_hex(64))')"
    FLASK_SECRET_KEY: AgTa47Y+PLACEHOLDER_ENCRYPT_WITH_KUBESEAL
  template:
    metadata:
      name: encryption-keys
      namespace: synthetic-erp-platform
      labels:
        app.kubernetes.io/part-of: synthetic-erp-platform
        app.kubernetes.io/component: encryption
        app.kubernetes.io/managed-by: kubeseal
      annotations:
        synthetic-erp.io/rotation-policy: "365d"
        synthetic-erp.io/encryption-algorithm: "AES-256-GCM"
        synthetic-erp.io/audit-classification: "critical"
    type: Opaque
