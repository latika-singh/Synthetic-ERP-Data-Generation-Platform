# =============================================================================
# Kubernetes ClusterIP Service - Quality Service
# =============================================================================
# Internal-only service exposing the Quality Service on port 5003 within the
# synthetic-erp-platform namespace. Provides DNS-based service discovery for
# the data quality validation pipeline.
#
# Consumers:
#   - Generation Engine: POST /validate (quality checks after batch generation)
#   - API Gateway: Quality report queries and score retrieval
#
# Quality Model:
#   Weighted scoring: Q = 0.40 * S_statistical + 0.30 * S_business_rules
#                       + 0.30 * S_referential_integrity
#   Target threshold: >= 95% fidelity
#
# Service Discovery DNS:
#   quality-service.synthetic-erp-platform.svc.cluster.local:5003
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: quality-service
  namespace: synthetic-erp-platform
  labels:
    # Primary application identifier - matches Deployment pod template labels
    app: quality-service
    # Kubernetes recommended labels (https://kubernetes.io/docs/concepts/overview/working-with-objects/common-labels/)
    app.kubernetes.io/name: quality-service
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: quality
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: "1.0.0"
  annotations:
    # Service description for operational documentation
    description: >-
      Internal ClusterIP service for data quality validation with weighted
      scoring (40% statistical fidelity, 30% business rules compliance,
      30% referential integrity) targeting >=95% overall fidelity score.
      Validates synthetic datasets generated by the Generation Engine using
      Great Expectations and Pydantic-based validation rules.
    # Prometheus metrics scraping configuration
    prometheus.io/scrape: "true"
    prometheus.io/port: "5003"
    prometheus.io/path: "/metrics"
spec:
  # ClusterIP type ensures the service is only reachable within the Kubernetes
  # cluster — the Quality Service is an internal backend service that should
  # never be directly exposed to external traffic.
  type: ClusterIP
  # Selector targets pods managed by the quality-service Deployment.
  # The 'app: quality-service' label must match the pod template labels
  # defined in infrastructure/kubernetes/quality-service/deployment.yaml
  selector:
    app: quality-service
  ports:
    # Primary HTTP port for the Quality Service Flask application
    - name: http
      protocol: TCP
      port: 5003
      targetPort: 5003
  # No session affinity required — the Quality Service is stateless and any
  # replica can handle any validation request independently.
  sessionAffinity: None
