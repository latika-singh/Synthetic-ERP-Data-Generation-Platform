# =============================================================================
# Horizontal Pod Autoscaler (HPA) Configurations
# Synthetic-ERP-Data-Generation-Platform
# =============================================================================
# Defines auto-scaling policies for all six backend microservices using the
# autoscaling/v2 API (Kubernetes 1.29+). Each HPA specifies:
#   - scaleTargetRef pointing to the corresponding Deployment
#   - minReplicas / maxReplicas for scaling bounds
#   - Metrics: CPU utilization, memory utilization, and custom metrics
#   - Behavior: stabilization windows and scaling policies for safe scaling
#
# Throughput Target: 1M+ records/minute (achieved via Generation Engine scaling)
#
# Custom Metrics Note:
#   The Generation Engine HPA uses a custom metric (generation_queue_depth)
#   exposed via Prometheus and made available to the HPA through the
#   Prometheus Adapter (k8s-prometheus-adapter). Ensure the Prometheus Adapter
#   is deployed in the monitoring namespace with a rule mapping:
#     seriesQuery: 'generation_queue_depth{namespace="synthetic-erp-platform"}'
#     metricsQuery: 'avg(generation_queue_depth{<<.LabelMatchers>>})'
# =============================================================================

# -----------------------------------------------------------------------------
# 1. API Gateway HPA
# -----------------------------------------------------------------------------
# The API Gateway is the primary entry point for all REST API traffic.
# It must maintain low latency and high availability under varying load.
# Scaling is based on both CPU and memory utilization.
#   - minReplicas: 2 (always maintain HA pair for zero-downtime)
#   - maxReplicas: 10 (handles burst API traffic)
#   - CPU target: 70% (scale before CPU saturation)
#   - Memory target: 80% (account for connection pooling and caching)
#   - ScaleUp stabilization: 60s (moderate response to traffic spikes)
#   - ScaleDown stabilization: 300s (conservative scale-down to avoid flapping)
# -----------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: synthetic-erp-platform
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "HPA for the API Gateway — scales based on CPU (70%) and memory (80%) utilization"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Primary metric: CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Secondary metric: Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        # Allow adding up to 4 pods per 60-second window
        - type: Pods
          value: 4
          periodSeconds: 60
        # Allow up to 100% increase per 60-second window
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        # Allow removing up to 2 pods per 120-second window
        - type: Pods
          value: 2
          periodSeconds: 120
        # Allow up to 25% decrease per 120-second window
        - type: Percent
          value: 25
          periodSeconds: 120
      selectPolicy: Min
---
# -----------------------------------------------------------------------------
# 2. Generation Engine HPA
# -----------------------------------------------------------------------------
# The Generation Engine is the core compute-intensive service responsible for
# synthetic data generation (AI/ML GAN/VAE, rules-based, statistical, masking).
# It has the highest max replicas to support the 1M+ records/minute throughput
# target. Scaling is driven by CPU utilization and a custom queue depth metric
# that tracks pending generation jobs in Redis.
#   - minReplicas: 2 (always maintain HA for continuous generation)
#   - maxReplicas: 20 (highest scale for burst generation workloads)
#   - CPU target: 60% (aggressive scaling threshold for ML workloads)
#   - Custom metric: generation_queue_depth > 5 triggers scale-up
#   - ScaleUp stabilization: 30s (fast response for burst job submissions)
#   - ScaleDown stabilization: 600s (very conservative to avoid killing active jobs)
# -----------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: generation-engine-hpa
  namespace: synthetic-erp-platform
  labels:
    app: generation-engine
    app.kubernetes.io/name: generation-engine
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: generation
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "HPA for the Generation Engine — scales based on CPU (60%) and custom queue depth metric for 1M+ records/min throughput"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: generation-engine
  minReplicas: 2
  maxReplicas: 20
  metrics:
    # Primary metric: CPU utilization (lower threshold for ML workloads)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    # Secondary metric: Memory utilization (ML models consume significant memory)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # Custom metric: Generation queue depth from Prometheus via Prometheus Adapter
    # Scales when average queue depth exceeds 5 pending jobs per pod
    # Requires: prometheus-adapter deployment with custom metrics API registration
    - type: Pods
      pods:
        metric:
          name: generation_queue_depth
        target:
          type: AverageValue
          averageValue: "5"
  behavior:
    scaleUp:
      # Fast scale-up for burst generation jobs — 30s stabilization
      stabilizationWindowSeconds: 30
      policies:
        # Allow adding up to 6 pods per 30-second window (aggressive for throughput)
        - type: Pods
          value: 6
          periodSeconds: 30
        # Allow up to 200% increase per 60-second window (rapid burst handling)
        - type: Percent
          value: 200
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      # Very conservative scale-down — 600s (10min) stabilization to avoid
      # terminating pods with active generation batches (each batch is ~10K records)
      stabilizationWindowSeconds: 600
      policies:
        # Allow removing up to 2 pods per 300-second window
        - type: Pods
          value: 2
          periodSeconds: 300
        # Allow up to 10% decrease per 300-second window
        - type: Percent
          value: 10
          periodSeconds: 300
      selectPolicy: Min
---
# -----------------------------------------------------------------------------
# 3. Profiling Service HPA
# -----------------------------------------------------------------------------
# The Profiling Service handles ERP schema discovery and statistical profiling.
# Workloads are moderate and driven by periodic schema extraction requests
# from the API Gateway.
#   - minReplicas: 1 (lower baseline — infrequent workload)
#   - maxReplicas: 5 (handles concurrent schema discovery sessions)
#   - CPU target: 70% (standard scaling threshold)
# -----------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: profiling-service-hpa
  namespace: synthetic-erp-platform
  labels:
    app: profiling-service
    app.kubernetes.io/name: profiling-service
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: profiling
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "HPA for the Profiling Service — scales based on CPU (70%) for ERP schema discovery and statistical profiling"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: profiling-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # Primary metric: CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Secondary metric: Memory utilization (SciPy/NumPy/Pandas profiling)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
---
# -----------------------------------------------------------------------------
# 4. Quality Service HPA
# -----------------------------------------------------------------------------
# The Quality Service validates generated data using Great Expectations with
# a weighted scoring model (40% statistical + 30% business rules + 30%
# referential integrity). Quality validation runs after every generation batch,
# making this service scale proportionally to the Generation Engine.
#   - minReplicas: 1 (lower baseline — triggered per completed batch)
#   - maxReplicas: 8 (handles parallel validation of concurrent generation jobs)
#   - CPU target: 65% (slightly aggressive for compute-heavy validation)
# -----------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quality-service-hpa
  namespace: synthetic-erp-platform
  labels:
    app: quality-service
    app.kubernetes.io/name: quality-service
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: quality
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "HPA for the Quality Service — scales based on CPU (65%) for data quality validation with Great Expectations"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quality-service
  minReplicas: 1
  maxReplicas: 8
  metrics:
    # Primary metric: CPU utilization (lower threshold for validation workloads)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    # Secondary metric: Memory utilization (Great Expectations validation suites)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
---
# -----------------------------------------------------------------------------
# 5. Compliance Service HPA
# -----------------------------------------------------------------------------
# The Compliance Service enforces zero-PII compliance through dual-layer
# detection (spaCy NLP + regex pattern matching) and regulatory verification
# (GDPR, HIPAA, CCPA). It gates every generated dataset through a state
# machine: Pending → Scanning → PIICheck → Certified → Released.
#   - minReplicas: 1 (lower baseline — triggered after quality validation)
#   - maxReplicas: 5 (handles concurrent compliance scanning)
#   - CPU target: 70% (NLP processing is CPU-intensive)
# -----------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compliance-service-hpa
  namespace: synthetic-erp-platform
  labels:
    app: compliance-service
    app.kubernetes.io/name: compliance-service
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: compliance
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "HPA for the Compliance Service — scales based on CPU (70%) for PII detection and regulatory compliance verification"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compliance-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # Primary metric: CPU utilization (spaCy NLP is CPU-intensive)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Secondary metric: Memory utilization (spaCy models in memory)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
---
# -----------------------------------------------------------------------------
# 6. Provisioning Service HPA
# -----------------------------------------------------------------------------
# The Provisioning Service exports generated data to target databases
# (PostgreSQL, Oracle, SQL Server, SAP HANA) via JDBC and cloud storage
# (AWS S3, Azure Blob, GCP Cloud Storage) via SDKs. It handles batch inserts
# and multi-part uploads with AES-256 encryption.
#   - minReplicas: 1 (lower baseline — triggered at end of generation pipeline)
#   - maxReplicas: 8 (handles parallel exports to multiple targets)
#   - CPU target: 65% (I/O-heavy but also handles data serialization)
# -----------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: provisioning-service-hpa
  namespace: synthetic-erp-platform
  labels:
    app: provisioning-service
    app.kubernetes.io/name: provisioning-service
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: provisioning
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "HPA for the Provisioning Service — scales based on CPU (65%) for database provisioning and cloud storage export"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: provisioning-service
  minReplicas: 1
  maxReplicas: 8
  metrics:
    # Primary metric: CPU utilization (data serialization and encryption)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    # Secondary metric: Memory utilization (batch data buffering for export)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
