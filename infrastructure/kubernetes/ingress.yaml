# =============================================================================
# Synthetic-ERP-Data-Generation-Platform — Kubernetes Ingress Configuration
# =============================================================================
# NGINX Ingress Controller configuration providing:
#   - TLS 1.3 termination for all external HTTPS traffic
#   - Path-based routing to API Gateway (/api/v1/*) and Web Console (/)
#   - CORS policy for cross-origin requests with tenant header support
#   - Rate limiting to protect backend services from abuse
#   - SSL redirect enforcement for all HTTP → HTTPS traffic
#   - Proxy timeout tuning for long-running generation job requests
#
# Prerequisites:
#   - NGINX Ingress Controller deployed (e.g., ingress-nginx Helm chart)
#   - TLS certificate stored in Secret "synthetic-erp-tls-secret" (see secrets.yaml)
#   - API Gateway Service (api-gateway) deployed on port 5000
#   - Web Console Service (web-console) deployed on port 80
#   - Namespace "synthetic-erp-platform" created (see namespace.yaml)
#
# Kubernetes Compatibility: 1.29+
# =============================================================================

---
# =============================================================================
# IngressClass: Declares the NGINX Ingress Controller as the default class
# =============================================================================
# The IngressClass resource associates the Ingress resources below with the
# NGINX Ingress Controller. Setting "is-default-class" ensures that Ingress
# resources without an explicit ingressClassName still use NGINX.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: ingress-controller
    app.kubernetes.io/managed-by: kubectl
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: k8s.io/ingress-nginx

---
# =============================================================================
# Ingress: Primary routing resource for the Synthetic ERP Platform
# =============================================================================
# Routes external HTTPS traffic to internal Kubernetes Services:
#   /api/v1/*  → api-gateway:5000   (Flask REST API)
#   /health    → api-gateway:5000   (Health check endpoint)
#   /          → web-console:80     (React SPA frontend)
#
# Security controls enforced at this layer:
#   - TLS 1.3 minimum protocol version (no TLS 1.0/1.1/1.2 negotiation)
#   - Forced HTTPS redirect for all plain HTTP requests
#   - CORS headers restricted to specified methods and custom headers
#   - Connection and request-per-second rate limiting
#   - Proxy body size cap at 100MB for large dataset uploads
#   - Extended read/send timeouts for long-running generation operations
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synthetic-erp-ingress
  namespace: synthetic-erp-platform
  labels:
    app.kubernetes.io/name: synthetic-erp-ingress
    app.kubernetes.io/part-of: synthetic-erp-platform
    app.kubernetes.io/component: ingress
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # -------------------------------------------------------------------------
    # Ingress Class Selection
    # -------------------------------------------------------------------------
    kubernetes.io/ingress.class: "nginx"

    # -------------------------------------------------------------------------
    # TLS / SSL Configuration
    # -------------------------------------------------------------------------
    # Enforce TLS 1.3 as the minimum protocol version. This satisfies the
    # platform requirement for TLS 1.3 in-transit encryption and aligns with
    # SOC 2 Type II cryptographic controls.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "true"

    # -------------------------------------------------------------------------
    # HSTS (HTTP Strict Transport Security)
    # -------------------------------------------------------------------------
    # Instruct browsers to only connect via HTTPS for the next year, including
    # all subdomains. Aligns with SOC 2 Type II transport security controls.
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"

    # -------------------------------------------------------------------------
    # Proxy Configuration
    # -------------------------------------------------------------------------
    # Allow large request bodies (up to 100MB) for dataset uploads and bulk
    # generation requests. Extended timeouts accommodate long-running
    # generation jobs and large schema discovery operations.
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"

    # -------------------------------------------------------------------------
    # CORS (Cross-Origin Resource Sharing) Configuration
    # -------------------------------------------------------------------------
    # Enable CORS to allow the Web Console (potentially on a different origin)
    # to make API calls. The X-Tenant-ID header is required for multi-tenant
    # namespace isolation. X-Request-ID supports distributed tracing via
    # OpenTelemetry correlation ID propagation.
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Tenant-ID, X-Request-ID, Accept, Origin"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://synthetic-erp.example.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"

    # -------------------------------------------------------------------------
    # Rate Limiting
    # -------------------------------------------------------------------------
    # Global rate limiting at the ingress layer provides a first line of
    # defense. More granular per-tier rate limiting (60/300/1000 req/min) is
    # enforced by the API Gateway middleware via Redis.
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-rpm: "600"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    # Additional HTTP response headers for defense-in-depth security posture.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";

    # -------------------------------------------------------------------------
    # Request ID / Tracing
    # -------------------------------------------------------------------------
    # Generate unique request IDs for distributed tracing correlation across
    # all microservices via OpenTelemetry.
    nginx.ingress.kubernetes.io/enable-opentracing: "true"
    nginx.ingress.kubernetes.io/generate-request-id: "true"

spec:
  # ---------------------------------------------------------------------------
  # IngressClass Reference
  # ---------------------------------------------------------------------------
  ingressClassName: nginx

  # ---------------------------------------------------------------------------
  # TLS Configuration
  # ---------------------------------------------------------------------------
  # Terminates TLS at the NGINX Ingress Controller. The referenced Secret
  # "synthetic-erp-tls-secret" must contain tls.crt and tls.key entries
  # (see secrets.yaml). TLS 1.3 is enforced via the ssl-protocols annotation.
  tls:
    - hosts:
        - synthetic-erp.example.com
      secretName: synthetic-erp-tls-secret

  # ---------------------------------------------------------------------------
  # Routing Rules
  # ---------------------------------------------------------------------------
  # Path-based routing directs traffic to the appropriate backend Service.
  # Paths are evaluated in order of specificity by the NGINX Ingress Controller:
  #   1. /api/v1/ (Prefix) — All REST API calls to the Flask API Gateway
  #   2. /health  (Exact)  — Health check probe (unauthenticated)
  #   3. /        (Prefix) — Catch-all for the React SPA frontend
  rules:
    - host: synthetic-erp.example.com
      http:
        paths:
          # -------------------------------------------------------------------
          # REST API Traffic → API Gateway (Flask 3.1.x on port 5000)
          # -------------------------------------------------------------------
          # All /api/v1/* requests are routed to the API Gateway service.
          # This includes generation jobs, profiles, schemas, templates,
          # export, auth, and admin endpoints. JWT authentication is
          # enforced at the API Gateway middleware layer.
          - path: /api/v1/
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 5000

          # -------------------------------------------------------------------
          # Health Check Endpoint → API Gateway
          # -------------------------------------------------------------------
          # Exact match for the /health endpoint used by external monitoring
          # systems and load balancer health probes. This endpoint is
          # unauthenticated by design to allow infrastructure health checks.
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  number: 5000

          # -------------------------------------------------------------------
          # Frontend SPA → Web Console (NGINX on port 80)
          # -------------------------------------------------------------------
          # Catch-all route serving the React 19.x + TypeScript 5.x SPA.
          # The web-console service serves the built static assets via an
          # NGINX container. Client-side routing (React Router 6.x) handles
          # all frontend navigation; unmatched paths serve index.html.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-console
                port:
                  number: 80
