# =============================================================================
# Synthetic-ERP-Data-Generation-Platform — Root Python Project Configuration
# =============================================================================
# This pyproject.toml provides workspace-level tooling configuration for the
# entire monorepo. It enforces consistent code quality standards across all six
# backend microservices (API Gateway, Generation Engine, Profiling Service,
# Quality Service, Compliance Service, Provisioning Service) and shared
# utilities via Ruff linting/formatting, mypy static type checking, pytest
# test settings, and coverage reporting.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Project Metadata
# -----------------------------------------------------------------------------
[project]
name = "synthetic-erp-data-generation-platform"
version = "1.0.0"
description = "Enterprise-grade platform for generating high-fidelity synthetic data that mirrors the structure, relationships, and statistical properties of production ERP systems."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Synthetic ERP Platform Team" },
]
keywords = [
    "synthetic-data",
    "erp",
    "data-generation",
    "privacy",
    "compliance",
    "testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/synthetic-erp/synthetic-erp-data-generation-platform"
Documentation = "https://github.com/synthetic-erp/synthetic-erp-data-generation-platform/tree/main/docs"
Repository = "https://github.com/synthetic-erp/synthetic-erp-data-generation-platform"
Issues = "https://github.com/synthetic-erp/synthetic-erp-data-generation-platform/issues"

# -----------------------------------------------------------------------------
# 2. Build System
# -----------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# TOOL CONFIGURATIONS
# =============================================================================

# -----------------------------------------------------------------------------
# 3. Ruff — Linting & Formatting (PEP 8 enforcement via Ruff)
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src/backend"]

# Fix all auto-fixable violations
fix = true

# Exclude standard directories from linting
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    ".eggs",
    "*.egg-info",
    "dist",
    "build",
    "migrations",
]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
# Comprehensive rule selection for enterprise-grade code quality:
#   E   — pycodestyle errors (PEP 8 style enforcement)
#   F   — Pyflakes (logical errors, unused imports/variables)
#   W   — pycodestyle warnings
#   I   — isort (import sorting and organization)
#   N   — pep8-naming (naming convention enforcement)
#   UP  — pyupgrade (Python version upgrade suggestions)
#   S   — flake8-bandit (security vulnerability detection)
#   B   — flake8-bugbear (common bug patterns)
#   A   — flake8-builtins (builtin shadowing prevention)
#   C4  — flake8-comprehensions (comprehension best practices)
#   DTZ — flake8-datetimez (timezone-aware datetime usage)
#   ISC — flake8-implicit-str-concat (string concatenation issues)
#   PIE — flake8-pie (miscellaneous lint rules)
#   PT  — flake8-pytest-style (pytest best practices)
#   RSE — flake8-raise (exception raising best practices)
#   SIM — flake8-simplify (code simplification suggestions)
#   TID — flake8-tidy-imports (import hygiene)
#   TCH — flake8-type-checking (TYPE_CHECKING block optimization)
#   ARG — flake8-unused-arguments (unused argument detection)
#   PLC — Pylint Convention (coding convention enforcement)
#   PLE — Pylint Error (probable error detection)
#   PLR — Pylint Refactor (refactoring suggestions)
#   PLW — Pylint Warning (various warning conditions)
#   RUF — Ruff-specific rules (additional quality checks)
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "S",
    "B",
    "A",
    "C4",
    "DTZ",
    "ISC",
    "PIE",
    "PT",
    "RSE",
    "SIM",
    "TID",
    "TCH",
    "ARG",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
]

# Ignored rules with rationale:
#   E501   — Line too long: handled by the Ruff formatter (line-length = 120)
#   S101   — Use of assert: required in test files for pytest assertions
#   S104   — Possible binding to all interfaces: needed for containerized services
#   S105   — Possible hardcoded password: triggers false positives on config variable names
#   S106   — Possible hardcoded password in function argument: false positives in configs
#   B008   — Function call in default argument: required for Flask/Pydantic dependency patterns
#   PLR0913 — Too many arguments: common in configuration-heavy service constructors
#   PLR2004 — Magic value in comparison: overly strict for threshold/config comparisons
#   PLR0911 — Too many return statements: acceptable in complex validation logic
#   ARG001 — Unused function argument: common in Flask route handlers and callbacks
#   RUF012 — Mutable class variables: needed for Pydantic model configurations
ignore = [
    "E501",
    "S101",
    "S104",
    "S105",
    "S106",
    "B008",
    "PLR0913",
    "PLR2004",
    "PLR0911",
    "ARG001",
    "RUF012",
]

# Per-path rule overrides for test files
[tool.ruff.lint.per-file-ignores]
# Test files: allow assertions, hardcoded credentials for test fixtures, magic values
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004", "ARG001", "PLR0913"]
# Configuration files: allow hardcoded strings that look like credentials
"**/config.py" = ["S105", "S106"]
# Init files: unused imports are expected for re-exports
"**/__init__.py" = ["F401", "F403"]

# -----------------------------------------------------------------------------
# 4. Ruff — Import Sorting (isort-compatible)
# -----------------------------------------------------------------------------
[tool.ruff.lint.isort]
known-first-party = [
    "shared",
    "api_gateway",
    "generation_engine",
    "profiling_service",
    "quality_service",
    "compliance_service",
    "provisioning_service",
]
# Group imports: stdlib → third-party → first-party → local
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
force-single-line = false
lines-after-imports = 2
combine-as-imports = true

# -----------------------------------------------------------------------------
# 5. Ruff — Docstring Convention (Google-style as per R-013)
# -----------------------------------------------------------------------------
[tool.ruff.lint.pydocstyle]
convention = "google"

# -----------------------------------------------------------------------------
# 6. Ruff — Code Formatting
# -----------------------------------------------------------------------------
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100

# -----------------------------------------------------------------------------
# 7. mypy — Static Type Checking
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_reexport = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["pydantic.mypy"]

# Module-specific overrides for third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "jaydebeapi.*",
    "great_expectations.*",
    "langchain.*",
    "langchain_community.*",
    "redis.*",
    "pymongo.*",
    "bson.*",
    "spacy.*",
    "circuitbreaker.*",
    "opa_client.*",
    "prometheus_client.*",
    "opentelemetry.*",
    "pyarrow.*",
    "boto3.*",
    "botocore.*",
    "azure.*",
    "google.*",
    "mongomock.*",
    "structlog.*",
]
ignore_missing_imports = true

# Overrides for internal shared sub-packages that may not yet be present during
# incremental generation.  These will be removed once every shared sub-module
# has been created and ships a py.typed marker.
# Overrides for internal sub-packages that may not yet be present during
# incremental project generation.  Each service's sub-modules are created by
# independent agents; until they are all present, mypy would emit
# import-untyped / import-not-found errors for forward references.  These
# overrides will be removed once every service module ships its own
# py.typed marker.
[[tool.mypy.overrides]]
module = [
    "shared.auth.*",
    "shared.middleware.*",
    "compliance_service.app",
    "compliance_service.config",
    "compliance_service.detectors.*",
    "compliance_service.regulations.gdpr",
    "compliance_service.regulations.hipaa",
    "compliance_service.regulations.ccpa",
    "compliance_service.certification.*",
    "provisioning_service.app",
    "provisioning_service.config",
    "provisioning_service.connectors.*",
    "provisioning_service.cloud.*",
    "provisioning_service.exporters.*",
]
ignore_missing_imports = true
follow_untyped_imports = true

# -----------------------------------------------------------------------------
# 8. mypy — Pydantic Plugin Configuration
# -----------------------------------------------------------------------------
[tool.mypy.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# -----------------------------------------------------------------------------
# 9. pytest — Test Configuration
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src/backend",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Custom markers for test categorization (test pyramid)
markers = [
    "unit: Unit tests — fast, isolated, no external dependencies",
    "integration: Integration tests — cross-service and database interaction",
    "e2e: End-to-end tests — full workflow through the system",
    "performance: Performance tests — throughput and latency benchmarks",
    "security: Security tests — vulnerability and compliance scanning",
    "slow: Tests that take longer than 5 seconds to execute",
]

# Minimum pytest version required
minversion = "8.0"

# -----------------------------------------------------------------------------
# 10. Coverage — Collection Settings
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/backend"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/.venv/*",
    "*/venv/*",
    "*/conftest.py",
    "**/wsgi.py",
]
branch = true
parallel = true

# -----------------------------------------------------------------------------
# 11. Coverage — Reporting Settings
# -----------------------------------------------------------------------------
[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
exclude_also = [
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
